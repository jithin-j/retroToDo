<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Paper background -->
  <rect width="32" height="32" fill="#f3ebd8"/>

  <!-- Double border -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#c1532a" stroke-width="1.5"/>
  <rect x="3.5" y="3.5" width="25" height="25" fill="none" stroke="#c1532a" stroke-width="0.75"/>

  <!-- Bold retro tick -->
  <polyline points="7,16 13,23 26,8"
            fill="none" stroke="#c1532a" stroke-width="4.5"
            stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
